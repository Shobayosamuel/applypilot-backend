# Local stack: Postgres -> Soda migrations -> API.
# Expects applypilot-migrations cloned next to this repo (../applypilot-migrations).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: applypilot
      POSTGRES_PASSWORD: applypilot
      POSTGRES_DB: applypilot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applypilot"]
      interval: 2s
      retries: 30

  migrations:
    build: ${MIGRATIONS_DIR:-../applypilot-migrations}
    environment:
      DATABASE_URL: postgres://applypilot:applypilot@db:5432/applypilot?sslmode=disable
    depends_on:
      db: { condition: service_healthy }

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://applypilot:applypilot@db:5432/applypilot?sslmode=disable
    ports: ["8080:8080"]
    depends_on:
      migrations: { condition: service_completed_successfully }

volumes:
  pgdata:
